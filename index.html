<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello Baby!</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;600;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #fce4ec 0%, #f3e5f5 30%, #e8eaf6 60%, #e1f5fe 100%);
      font-family: 'Quicksand', 'Arial Rounded MT Bold', sans-serif;
      overflow: hidden;
      position: relative;
    }

    /* Floating bubbles */
    .bubble {
      position: fixed;
      border-radius: 50%;
      opacity: 0;
      animation: floatUp linear infinite;
      pointer-events: none;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(110vh) scale(0);
        opacity: 0;
      }
      10% {
        opacity: 0.7;
      }
      90% {
        opacity: 0.7;
      }
      100% {
        transform: translateY(-10vh) scale(1);
        opacity: 0;
      }
    }

    /* Stars */
    .star {
      position: fixed;
      width: 4px;
      height: 4px;
      background: white;
      border-radius: 50%;
      box-shadow: 0 0 6px 2px rgba(255, 255, 255, 0.8);
      animation: twinkle ease-in-out infinite alternate;
      pointer-events: none;
    }

    @keyframes twinkle {
      0% { opacity: 0.2; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1.2); }
    }

    /* Heart shapes */
    .heart {
      position: fixed;
      font-size: 20px;
      animation: heartFloat ease-in-out infinite alternate;
      pointer-events: none;
      opacity: 0.6;
    }

    @keyframes heartFloat {
      0% { transform: translateY(0) scale(1); }
      100% { transform: translateY(-20px) scale(1.2); }
    }

    /* Main card */
    .card {
      position: relative;
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 32px;
      padding: 60px 80px;
      text-align: center;
      box-shadow:
        0 20px 60px rgba(236, 72, 153, 0.1),
        0 8px 24px rgba(139, 92, 246, 0.08),
        0 0 0 1px rgba(255, 255, 255, 0.6) inset;
      animation: cardEntrance 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      max-width: 90vw;
    }

    @keyframes cardEntrance {
      0% {
        opacity: 0;
        transform: translateY(60px) scale(0.9);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Decorative ring */
    .card::before {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 35px;
      background: linear-gradient(
        135deg,
        #f9a8d4, #c084fc, #7dd3fc, #fde68a, #f9a8d4
      );
      background-size: 400% 400%;
      animation: borderGlow 6s ease infinite;
      z-index: -1;
      opacity: 0.6;
    }

    @keyframes borderGlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Title */
    .title {
      font-size: clamp(2.5rem, 8vw, 5rem);
      font-weight: 700;
      letter-spacing: -1px;
      background: linear-gradient(
        90deg,
        #ec4899,
        #a855f7,
        #6366f1,
        #06b6d4,
        #a855f7,
        #ec4899
      );
      background-size: 300% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: gradientShift 4s ease infinite, titleBounce 3s ease-in-out infinite;
      line-height: 1.2;
    }

    @keyframes gradientShift {
      0%, 100% { background-position: 0% center; }
      50% { background-position: 100% center; }
    }

    @keyframes titleBounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    /* Subtitle */
    .subtitle {
      margin-top: 20px;
      font-size: clamp(1rem, 3vw, 1.4rem);
      color: #a78bfa;
      font-weight: 400;
      letter-spacing: 3px;
      text-transform: uppercase;
      animation: fadeInUp 1s 0.6s ease both;
    }

    @keyframes fadeInUp {
      0% {
        opacity: 0;
        transform: translateY(20px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Decorative hearts row */
    .hearts {
      margin-top: 30px;
      display: flex;
      justify-content: center;
      gap: 16px;
      animation: fadeInUp 1s 0.9s ease both;
    }

    .hearts span {
      font-size: 1.5rem;
      animation: heartPulse 2s ease-in-out infinite;
    }

    .hearts span:nth-child(2) { animation-delay: 0.3s; }
    .hearts span:nth-child(3) { animation-delay: 0.6s; }
    .hearts span:nth-child(4) { animation-delay: 0.9s; }
    .hearts span:nth-child(5) { animation-delay: 1.2s; }

    @keyframes heartPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.3); }
    }

    /* Sparkle dots */
    .sparkle {
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      animation: sparkleAnim 3s ease-in-out infinite;
    }

    @keyframes sparkleAnim {
      0%, 100% { opacity: 0; transform: scale(0); }
      50% { opacity: 1; transform: scale(1); }
    }

    /* Ripple effect under title */
    .ripple {
      position: absolute;
      border-radius: 50%;
      border: 2px solid rgba(168, 85, 247, 0.2);
      animation: rippleExpand 3s ease-out infinite;
      pointer-events: none;
    }

    @keyframes rippleExpand {
      0% {
        width: 200px;
        height: 200px;
        opacity: 0.8;
      }
      100% {
        width: 600px;
        height: 600px;
        opacity: 0;
      }
    }

    /* Responsive */
    @media (max-width: 600px) {
      .card {
        padding: 40px 30px;
        border-radius: 24px;
      }

      .card::before {
        border-radius: 27px;
      }

      .hearts span {
        font-size: 1.2rem;
      }
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- Decorative ripples -->
    <div class="ripple" style="top: 50%; left: 50%; transform: translate(-50%, -50%); animation-delay: 0s;"></div>
    <div class="ripple" style="top: 50%; left: 50%; transform: translate(-50%, -50%); animation-delay: 1s;"></div>
    <div class="ripple" style="top: 50%; left: 50%; transform: translate(-50%, -50%); animation-delay: 2s;"></div>

    <h1 class="title">Hello Baby!</h1>
    <p class="subtitle">Welcome to the world</p>

    <div class="hearts">
      <span>💗</span>
      <span>💜</span>
      <span>💙</span>
      <span>💚</span>
      <span>💛</span>
    </div>
  </div>

  <script>
    // Generate floating bubbles
    function createBubble() {
      const bubble = document.createElement('div');
      bubble.classList.add('bubble');
      const size = Math.random() * 30 + 10;
      const colors = [
        'rgba(252, 165, 209, 0.4)',
        'rgba(196, 181, 253, 0.35)',
        'rgba(125, 211, 252, 0.35)',
        'rgba(253, 230, 138, 0.4)',
        'rgba(167, 139, 250, 0.3)',
        'rgba(244, 114, 182, 0.3)',
      ];
      bubble.style.width = size + 'px';
      bubble.style.height = size + 'px';
      bubble.style.left = Math.random() * 100 + 'vw';
      bubble.style.background = colors[Math.floor(Math.random() * colors.length)];
      bubble.style.filter = `blur(${size * 0.2}px)`;
      bubble.style.animationDuration = (Math.random() * 10 + 12) + 's';
      bubble.style.animationDelay = (Math.random() * 5) + 's';
      document.body.appendChild(bubble);

      setTimeout(() => bubble.remove(), 22000);
    }

    for (let i = 0; i < 20; i++) {
      setTimeout(createBubble, i * 600);
    }
    setInterval(createBubble, 2000);

    // Generate stars
    for (let i = 0; i < 40; i++) {
      const star = document.createElement('div');
      star.classList.add('star');
      star.style.left = Math.random() * 100 + 'vw';
      star.style.top = Math.random() * 100 + 'vh';
      star.style.animationDuration = (Math.random() * 3 + 1) + 's';
      star.style.animationDelay = (Math.random() * 3) + 's';
      star.style.width = (Math.random() * 4 + 2) + 'px';
      star.style.height = star.style.width;
      document.body.appendChild(star);
    }

    // Generate floating hearts
    const heartEmojis = ['💗', '💖', '💜', '💙', '🌸', '✨', '⭐'];
    for (let i = 0; i < 12; i++) {
      const heart = document.createElement('div');
      heart.classList.add('heart');
      heart.textContent = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.top = Math.random() * 100 + 'vh';
      heart.style.fontSize = (Math.random() * 16 + 14) + 'px';
      heart.style.animationDuration = (Math.random() * 3 + 2) + 's';
      heart.style.animationDelay = (Math.random() * 4) + 's';
      document.body.appendChild(heart);
    }
  </script>

</body>
</html>
